<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: transparent; font-family: 'Segoe UI', sans-serif; }
#video-wrap { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
#video-wrap video { width: 100%; height: 100%; object-fit: cover; }
#overlay {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 12px 16px; background: linear-gradient(transparent, rgba(0,0,0,0.85));
  color: #e6edf3;
}
#title { font-size: 16px; font-weight: bold; margin-bottom: 4px; }
#desc { font-size: 11px; color: #8b949e; margin-bottom: 4px; }
#points { font-size: 12px; font-weight: bold; color: #3fb950; }
#badge { position: absolute; top: 12px; right: 12px; width: 48px; height: 48px; border-radius: 4px; object-fit: contain; }
</style>
</head>
<body>
<div id="video-wrap">
  <video id="vid" autoplay muted playsinline></video>
</div>
<img id="badge" src="" alt="" style="display:none">
<div id="overlay">
  <div id="title"></div>
  <div id="desc"></div>
  <div id="points"></div>
</div>
<script>
function show(data) {
  document.getElementById('title').textContent = data.title || 'Achievement Unlocked';
  document.getElementById('desc').textContent = data.description || '';
  document.getElementById('points').textContent = (data.points != null) ? (data.points + ' pts') : '';
  var badge = document.getElementById('badge');
  if (data.url) {
    badge.src = data.url;
    badge.style.display = 'block';
  } else {
    badge.style.display = 'none';
  }
  var v = document.getElementById('vid');
  if (data.videoPath && v) {
    v.src = data.videoPath;
    v.play().catch(function(){});
  }
}
</script>
</body>
</html>
